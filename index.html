<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Atlas — GCC Source of Truth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#F8F9FC;
  --ink:#15172A; --muted:#6B7189; --faint:#9AA0B4;
  --line:#E7E9F0; --line-2:#EEF0F5;
  --brand:#2E3192; --brand-2:#3C40B6; --brand-soft:#ECEDFB;
  --accent:#E08B00; --accent-bright:#F5A524; --accent-soft:#FDF3DD;
  --live:#17B26A; --live-soft:#E6F7EE;
  --hiring:#2E7BF6; --hiring-soft:#E7F0FE;
  --expand:#8C5BE8; --expand-soft:#F1EAFD;
  --teal:#0E9CA5; --teal-soft:#E0F5F6;
  --announce:#E08B00; --announce-soft:#FDF3DD;
  --danger:#E5484D;
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --shadow-sm:0 1px 2px rgba(20,22,45,.05);
  --shadow-md:0 8px 24px -8px rgba(23,27,60,.14);
  --shadow-lg:0 20px 48px -16px rgba(23,27,60,.28);
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --disp:"Space Grotesk","Inter",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans); background:#E4E6EE; color:var(--ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  display:flex; align-items:center; justify-content:center; min-height:100dvh;
  background:
    radial-gradient(1200px 600px at 50% -10%, #EEF0F8 0%, #E4E6EE 55%, #DEE0EA 100%);
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--brand-2); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* icon sizing safety net for inline icons without explicit dims */
.searchbar>svg,.searchhead .inp>svg{width:20px;height:20px;color:var(--faint);flex:0 0 auto}
.est>svg{width:15px;height:15px;flex:0 0 auto}
.brand .glyph>svg{width:18px;height:18px}
.res .av>svg{width:20px;height:20px}
.cap svg{width:14px;height:14px}

/* ---------- device frame ---------- */
.device{
  width:432px; height:min(924px,96dvh); background:#0C0D14;
  border-radius:52px; padding:11px; box-shadow:var(--shadow-lg);
  position:relative;
}
.app{
  position:relative; width:100%; height:100%; background:var(--bg);
  border-radius:42px; overflow:hidden; display:flex; flex-direction:column;
}
@media (max-width:520px){
  body{background:var(--bg)}
  .device{width:100vw;height:100dvh;border-radius:0;padding:0;box-shadow:none}
  .app{border-radius:0}
}

/* ---------- status bar ---------- */
.statusbar{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 11px) 24px 7px;
  font-family:var(--disp); font-weight:600; font-size:14px; color:var(--ink);
  background:var(--surface);
}
.statusbar .dots{display:flex;gap:5px;align-items:center}
.statusbar svg{display:block}

/* ---------- app bar ---------- */
.appbar{
  flex:0 0 auto; background:var(--surface); border-bottom:1px solid var(--line-2);
  padding:4px 18px 12px; display:flex; align-items:center; gap:12px; min-height:52px;
}
.appbar.flush{border-bottom:none}
.appbar .back{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:var(--surface-2);color:var(--ink);flex:0 0 auto}
.appbar .back:active{background:var(--line)}
.brand{display:flex;align-items:center;gap:9px}
.brand .glyph{width:32px;height:32px;border-radius:9px;background:var(--brand);
  display:grid;place-items:center;box-shadow:0 2px 8px -2px rgba(46,49,146,.5)}
.brand .wm{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:-.4px}
.brand .wm b{color:var(--brand)}
.appbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill-india{display:flex;align-items:center;gap:6px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:999px;padding:6px 11px 6px 9px;
  font-size:12.5px;font-weight:600;color:var(--muted)}
.pill-india .dot{width:7px;height:7px;border-radius:50%;background:var(--live)}
.appbar .title{font-family:var(--disp);font-weight:600;font-size:18px;letter-spacing:-.3px}

/* ---------- content scroll ---------- */
.content{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.content::-webkit-scrollbar{width:0}
.pad{padding:18px}
.gap-tight>*+*{margin-top:10px}

/* ---------- bottom nav ---------- */
.bottomnav{
  flex:0 0 auto; background:var(--surface); border-top:1px solid var(--line-2);
  display:flex; justify-content:space-around; align-items:stretch;
  padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px);
}
.navitem{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;
  padding:5px 2px;color:var(--faint);position:relative;border-radius:12px}
.navitem .lab{font-size:10.5px;font-weight:600;letter-spacing:-.1px}
.navitem.active{color:var(--brand)}
.navitem.active .ic{transform:translateY(-1px)}
.navitem .ic svg{width:23px;height:23px}
.navitem.active::before{content:"";position:absolute;top:0;width:22px;height:3px;
  border-radius:0 0 4px 4px;background:var(--brand)}

/* ---------- hero (the signature block) ---------- */
.hero{padding:20px 18px 22px;background:
  linear-gradient(180deg,var(--surface) 0%,var(--surface) 58%,var(--bg) 100%)}
.hero .greet{color:var(--muted);font-size:14px;font-weight:500}
.hero .greet b{color:var(--ink);font-weight:600}
.searchbar{margin-top:14px;display:flex;align-items:center;gap:10px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:15px;
  padding:13px 15px;color:var(--faint);box-shadow:var(--shadow-sm)}
.searchbar span{font-size:15px;font-weight:450;color:var(--muted)}
.searchbar .k{margin-left:auto;font-size:11px;color:var(--faint);
  border:1px solid var(--line);border-radius:6px;padding:2px 6px}

.truthcard{margin-top:18px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow-md);overflow:hidden}
.truthcard .top{padding:18px 18px 16px}
.truthcard .cap{display:flex;align-items:center;gap:7px;color:var(--muted);
  font-size:12.5px;font-weight:600}
.truthcard .cap .live{width:6px;height:6px;border-radius:50%;background:var(--live);
  box-shadow:0 0 0 3px var(--live-soft)}
.bignum{font-family:var(--disp);font-weight:600;font-size:60px;line-height:.98;
  letter-spacing:-2px;margin-top:10px;font-variant-numeric:tabular-nums;color:var(--ink)}
.bignum .u{font-size:22px;color:var(--muted);letter-spacing:-.5px;margin-left:8px}
.bigsub{margin-top:5px;font-size:14.5px;color:var(--muted);font-weight:500}
.bigsub b{color:var(--ink);font-weight:600}

/* range strip — "show the disagreement" */
.range{margin:16px 18px 0;padding:14px 15px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:14px}
.range .rl{display:flex;justify-content:space-between;align-items:baseline;
  font-size:12.5px;color:var(--muted);font-weight:500}
.range .rl b{color:var(--ink);font-weight:600}
.range .track{margin:11px 0 7px;height:7px;border-radius:999px;position:relative;
  background:linear-gradient(90deg,var(--line) 0%,#DADDEA 100%)}
.range .fill{position:absolute;left:8%;right:28%;top:0;bottom:0;border-radius:999px;
  background:linear-gradient(90deg,var(--brand-soft),#C9CBF0)}
.range .mark{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;
  background:var(--brand);border:3px solid #fff;transform:translate(-50%,-50%);
  box-shadow:0 2px 6px rgba(46,49,146,.45)}
.range .ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);
  font-variant-numeric:tabular-nums;font-weight:500}

/* source chip — provenance made visible (the amber "receipt") */
.srcrow{margin-top:16px;padding:0 18px 18px;display:flex;align-items:center;gap:8px;
  flex-wrap:wrap}
.srcchip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);
  color:#9A6200;border:1px solid #F2DCA6;border-radius:999px;
  padding:6px 11px 6px 9px;font-size:12px;font-weight:600}
.srcchip svg{width:14px;height:14px}
.srcchip .ch{opacity:.55}
.est{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);
  color:var(--muted);border:1px solid var(--line);border-radius:999px;
  padding:6px 11px;font-size:12px;font-weight:600}

/* ---------- supporting stat row ---------- */
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-2);
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-top:4px}
.statcell{background:var(--surface);padding:14px 13px}
.statcell .v{font-family:var(--disp);font-weight:600;font-size:23px;letter-spacing:-.6px;
  font-variant-numeric:tabular-nums}
.statcell .v .u{font-size:13px;color:var(--muted)}
.statcell .l{margin-top:3px;font-size:11.5px;color:var(--muted);font-weight:500;line-height:1.3}
.statcell .src{margin-top:8px;display:inline-flex;align-items:center;gap:4px;
  font-size:10.5px;color:var(--accent);font-weight:600}
.statcell .src svg{width:11px;height:11px}

/* ---------- section head ---------- */
.sec{padding:24px 18px 0}
.sechead{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.sechead h2{font-family:var(--disp);font-weight:600;font-size:18.5px;letter-spacing:-.4px}
.sechead .more{font-size:13px;font-weight:600;color:var(--brand);display:flex;
  align-items:center;gap:2px}
.seclead{font-size:13px;color:var(--muted);margin:-6px 0 13px;line-height:1.45}

/* ---------- module tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:15px;text-align:left;transition:transform .12s ease,box-shadow .12s ease;
  display:flex;flex-direction:column;gap:12px;min-height:116px}
.tile:active{transform:scale(.975)}
.tile .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center}
.tile .ic svg{width:21px;height:21px}
.tile .tt{font-weight:600;font-size:14.5px;letter-spacing:-.2px}
.tile .ts{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.tile .meta{margin-top:auto;font-family:var(--disp);font-weight:600;font-size:13px;
  color:var(--ink);font-variant-numeric:tabular-nums}
.ic-brand{background:var(--brand-soft);color:var(--brand)}
.ic-live{background:var(--live-soft);color:var(--live)}
.ic-hiring{background:var(--hiring-soft);color:var(--hiring)}
.ic-expand{background:var(--expand-soft);color:var(--expand)}
.ic-amber{background:var(--accent-soft);color:var(--accent)}
.ic-ink{background:#EAECF2;color:var(--ink)}

/* ---------- coming-next feature ---------- */
.pipe{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--shadow-sm)}
.pipe .ph{padding:16px 16px 14px;display:flex;align-items:center;gap:13px;
  border-bottom:1px solid var(--line-2)}
.pipe .ph .n{font-family:var(--disp);font-weight:600;font-size:30px;letter-spacing:-1px;
  font-variant-numeric:tabular-nums;line-height:1}
.pipe .ph .t{font-size:13px;color:var(--muted);font-weight:500;line-height:1.35}
.pipe .ph .t b{color:var(--ink);font-weight:600}
.pipe .ph .badge{margin-left:auto}
.signal{padding:14px 16px;display:flex;align-items:flex-start;gap:12px}
.signal+.signal{border-top:1px solid var(--line-2)}
.signal .av{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:grid;
  place-items:center;font-family:var(--disp);font-weight:600;font-size:15px;color:#fff}
.signal .mid{flex:1;min-width:0}
.signal .nm{font-weight:600;font-size:14.5px;letter-spacing:-.2px}
.signal .de{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.signal .foot{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.signal .ch{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;
  color:var(--accent);font-weight:600}
.signal .ch svg{width:11px;height:11px}

.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;
  padding:4px 9px;font-size:11px;font-weight:600}
.tag .d{width:6px;height:6px;border-radius:50%}
.tag-live{background:var(--live-soft);color:#0B7B4B}
.tag-live .d{background:var(--live)}
.tag-hiring{background:var(--hiring-soft);color:#1A5FD0}
.tag-hiring .d{background:var(--hiring)}
.tag-expand{background:var(--expand-soft);color:#6B3FC4}
.tag-expand .d{background:var(--expand)}
.tag-announce{background:var(--announce-soft);color:#9A6200}
.tag-announce .d{background:var(--announce)}

/* ---------- city ledger ---------- */
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  overflow:hidden}
.lrow{display:flex;align-items:center;gap:13px;padding:14px 16px}
.lrow+.lrow{border-top:1px solid var(--line-2)}
.lrow:active{background:var(--surface-2)}
.lrow .rank{font-family:var(--disp);font-weight:600;font-size:13px;color:var(--faint);
  width:16px;font-variant-numeric:tabular-nums}
.lrow .cnm{font-weight:600;font-size:14.5px;letter-spacing:-.2px}
.lrow .cde{font-size:12px;color:var(--muted);margin-top:1px}
.lrow .rt{margin-left:auto;text-align:right}
.lrow .rt .v{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:-.5px;
  font-variant-numeric:tabular-nums}
.lrow .rt .v .plus{color:var(--accent);font-size:14px}
.lrow .rt .s{font-size:10.5px;color:var(--faint);font-weight:500;margin-top:1px}
.lrow .chev{color:var(--faint);flex:0 0 auto}

/* ---------- trust strip ---------- */
.trust{margin:22px 18px 8px;background:linear-gradient(135deg,#1E2060,#2E3192);
  border-radius:var(--r-lg);padding:20px;color:#fff;position:relative;overflow:hidden}
.trust .shield{position:absolute;right:-18px;top:-14px;opacity:.14}
.trust .shield svg{width:130px;height:130px}
.trust h3{font-family:var(--disp);font-weight:600;font-size:18px;letter-spacing:-.4px}
.trust p{font-size:13px;color:#C9CBEF;margin-top:7px;line-height:1.5;max-width:85%}
.trust .cta{margin-top:14px;display:inline-flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  color:#fff;font-weight:600;font-size:13px;padding:10px 15px;border-radius:12px}
.trust .cta svg{width:15px;height:15px}

/* ---------- search screen ---------- */
.searchhead{background:var(--surface);border-bottom:1px solid var(--line-2);
  padding:4px 16px 14px;display:flex;align-items:center;gap:10px}
.searchhead .inp{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface-2);
  border:1.5px solid var(--brand-soft);border-radius:14px;padding:11px 14px}
.searchhead input{border:none;background:none;outline:none;flex:1;font-size:15px;
  font-family:var(--sans);color:var(--ink);font-weight:450}
.searchhead input::placeholder{color:var(--faint)}
.searchhead .clr{color:var(--faint)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:9px 14px;font-size:13px;font-weight:600;color:var(--ink)}
.chip:active{background:var(--surface-2)}
.subtle{font-size:12px;font-weight:600;color:var(--faint);
  margin:2px 0 11px;letter-spacing:.2px}
.resgroup+.resgroup{margin-top:20px}
.res{display:flex;align-items:center;gap:13px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.res+.res{margin-top:9px}
.res:active{background:var(--surface-2)}
.res .av{width:40px;height:40px;border-radius:11px;flex:0 0 auto;display:grid;
  place-items:center;font-family:var(--disp);font-weight:600;font-size:14px;color:#fff}
.res .av.soft{background:var(--surface-2)!important;color:var(--brand)}
.res .nm{font-weight:600;font-size:14.5px;letter-spacing:-.2px}
.res .de{font-size:12px;color:var(--muted);margin-top:2px}
.res .chev{margin-left:auto;color:var(--faint)}
.empty{text-align:center;color:var(--muted);padding:50px 30px}
.empty .big{font-family:var(--disp);font-weight:600;font-size:17px;color:var(--ink);
  margin-bottom:6px}
.empty p{font-size:13.5px;line-height:1.5}

/* ---------- placeholder (modules not yet built) ---------- */
.ph-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;height:100%;padding:40px 36px}
.ph-screen .big-ic{width:74px;height:74px;border-radius:20px;display:grid;place-items:center;
  margin-bottom:20px}
.ph-screen .big-ic svg{width:36px;height:36px}
.ph-screen h2{font-family:var(--disp);font-weight:600;font-size:23px;letter-spacing:-.5px}
.ph-screen .roadtag{margin-top:12px;display:inline-flex;align-items:center;gap:7px;
  background:var(--accent-soft);color:#9A6200;border:1px solid #F2DCA6;
  border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600}
.ph-screen p{font-size:14px;color:var(--muted);line-height:1.55;margin-top:16px;max-width:300px}
.ph-list{margin-top:20px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:9px}
.ph-list .it{display:flex;align-items:center;gap:11px;background:var(--surface);
  border:1px solid var(--line);border-radius:13px;padding:13px 15px;text-align:left}
.ph-list .it .d{width:8px;height:8px;border-radius:50%;background:var(--brand);flex:0 0 auto}
.ph-list .it span{font-size:13.5px;font-weight:500;color:var(--ink)}

/* ---------- bottom sheet ---------- */
.scrim{position:absolute;inset:0;background:rgba(15,16,30,.44);opacity:0;
  pointer-events:none;transition:opacity .22s ease;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);
  border-radius:26px 26px 0 0;z-index:50;transform:translateY(102%);
  transition:transform .3s cubic-bezier(.32,.72,0,1);
  padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 22px);max-height:84%;
  overflow-y:auto;box-shadow:0 -12px 40px -12px rgba(15,16,30,.4)}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:38px;height:4.5px;border-radius:999px;background:var(--line);
  margin:6px auto 14px}
.sheet h3{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:-.4px;
  display:flex;align-items:center;gap:9px}
.sheet h3 .vb{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);
  color:var(--accent);display:grid;place-items:center}
.sheet h3 .vb svg{width:15px;height:15px}
.srcmeta{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.srcmeta .m{display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:13px 15px;font-size:13.5px}
.srcmeta .m+.m{border-top:1px solid var(--line-2)}
.srcmeta .m .k{color:var(--muted);font-weight:500}
.srcmeta .m .v{font-weight:600;text-align:right}
.srcmeta .m .v.ok{color:#0B7B4B}
.sheet .note{font-size:13px;color:var(--muted);line-height:1.55;margin-top:14px}
.sheet .link{margin-top:16px;width:100%;display:flex;align-items:center;justify-content:center;
  gap:8px;background:var(--brand);color:#fff;font-weight:600;font-size:14px;
  padding:14px;border-radius:14px}
.sheet .link svg{width:15px;height:15px}
.sheet .foot-note{margin-top:12px;font-size:11.5px;color:var(--faint);text-align:center;
  line-height:1.5}

/* ---------- toast ---------- */
.toast{position:absolute;left:50%;bottom:88px;transform:translate(-50%,16px);
  background:var(--ink);color:#fff;font-size:13px;font-weight:500;padding:12px 18px;
  border-radius:13px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:60;
  box-shadow:var(--shadow-md);max-width:84%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

.fadein{animation:fade .34s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== Part 2: directory ===== */
.iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink);position:relative}
.iconbtn:active{background:var(--line)}
.iconbtn.on{background:var(--brand-soft);color:var(--brand)}
.iconbtn svg{width:19px;height:19px}
.fdot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent-bright);border:1.5px solid #fff}
.dir-controls{background:var(--surface);border-bottom:1px solid var(--line-2);padding:12px 0}
.qrow{display:flex;gap:8px;overflow-x:auto;padding:0 18px 2px;scrollbar-width:none}
.qrow::-webkit-scrollbar{height:0}
.qchip{flex:0 0 auto;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600;color:var(--muted)}
.qchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.countrow{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 0;gap:10px}
.countrow .cnt{font-size:12.5px;color:var(--muted)}
.countrow .cnt b{color:var(--ink);font-family:var(--disp);font-weight:600}
.sortbtn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:7px 12px;border-radius:10px;flex:0 0 auto}
.sortbtn svg{width:15px;height:15px}
.gcard{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px 14px;width:100%;text-align:left}
.gcard+.gcard{margin-top:10px}
.gcard:active{background:var(--surface-2)}
.gav{width:46px;height:46px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;font-family:var(--disp);font-weight:600;font-size:15px;color:#fff}
.gmid{flex:1;min-width:0}
.gnm{font-weight:600;font-size:15px;letter-spacing:-.2px;display:flex;align-items:center;gap:6px}
.vchk{display:inline-flex;color:var(--live);flex:0 0 auto}
.vchk svg{width:14px;height:14px}
.gde{font-size:12.5px;color:var(--muted);margin-top:2px}
.metarow{display:flex;gap:12px;margin-top:9px;flex-wrap:wrap}
.metarow .m{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);font-weight:500}
.metarow .m svg{width:13px;height:13px;color:var(--faint)}
.metarow .m.hot{color:var(--accent)}
.metarow .m.hot svg{color:var(--accent)}
.gcard .chev{color:var(--faint);flex:0 0 auto}

/* ===== Part 2: company detail ===== */
.src{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--accent);font-weight:600}
.src svg{width:11px;height:11px}
.cdetail{padding-bottom:8px}
.chead{padding:18px 18px 4px;display:flex;flex-direction:column;align-items:flex-start}
.cav{width:60px;height:60px;border-radius:17px;display:grid;place-items:center;font-family:var(--disp);font-weight:600;font-size:21px;color:#fff;margin-bottom:13px}
.cnm{font-family:var(--disp);font-weight:600;font-size:23px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.cnm .vchk svg{width:18px;height:18px}
.cmeta{font-size:13px;color:var(--muted);margin-top:5px;font-weight:500}
.cstats{margin:16px 18px 0}
.ftags{display:flex;gap:8px;flex-wrap:wrap}
.ftag{background:var(--brand-soft);color:var(--brand);border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:600}
.urow{display:flex;align-items:center;gap:13px;padding:14px 16px}
.urow+.urow{border-top:1px solid var(--line-2)}
.uav{width:38px;height:38px;border-radius:11px;background:var(--surface-2);color:var(--brand);display:grid;place-items:center;flex:0 0 auto}
.uav svg{width:18px;height:18px}
.unm{font-weight:600;font-size:14px}
.ufocus{font-size:12px;color:var(--muted);margin-top:1px}
.utag{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:4px 9px;border-radius:999px;flex:0 0 auto}
.hire{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.hire .hh{padding:15px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line-2)}
.hire .hh .n{font-family:var(--disp);font-weight:600;font-size:26px;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.hire .hh .t{font-size:13px;color:var(--muted);font-weight:500;line-height:1.35}
.hire .hh .t b{color:var(--ink)}
.hrole{padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:13.5px}
.hrole+.hrole{border-top:1px solid var(--line-2)}
.hrole .rt{font-weight:500}
.hrole .rc{margin-left:auto;font-size:12px;color:var(--muted)}
.hrole .dot{width:6px;height:6px;border-radius:50%;background:var(--live);flex:0 0 auto}
.lead{display:flex;align-items:center;gap:12px;padding:13px 16px}
.lead+.lead{border-top:1px solid var(--line-2)}
.lav{width:40px;height:40px;border-radius:50%;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;font-family:var(--disp);font-weight:600;font-size:13px;flex:0 0 auto}
.lrole{font-size:12px;color:var(--muted)}
.lname{font-weight:600;font-size:14px;margin-top:1px}
.srcpanel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.sprow{display:flex;align-items:center;gap:12px;padding:13px 15px;width:100%;text-align:left}
.sprow+.sprow{border-top:1px solid var(--line-2)}
.sprow:active{background:var(--surface-2)}
.sprow .sl{flex:1;min-width:0}
.sprow .sl .k{font-weight:600;font-size:13.5px}
.sprow .sl .s{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px}
.sprow .sl .s svg{width:12px;height:12px;color:var(--faint)}
.tag-neutral{background:var(--surface-2);color:var(--muted)}
.tag-neutral .d{background:var(--faint)}
.cfoot{padding:16px 18px 20px;color:var(--faint);font-size:12px;text-align:center;line-height:1.5}
.cta-ghost{margin:6px 18px 0;width:calc(100% - 36px);display:flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;font-weight:600;font-size:14.5px;padding:15px;border-radius:14px}
.cta-ghost:active{background:var(--brand-2)}
.cta-ghost svg{width:17px;height:17px}

/* ===== Part 2: filter sheet ===== */
.fhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.fhead h3{font-family:var(--disp);font-weight:600;font-size:20px;letter-spacing:-.4px}
.freset{font-size:13px;font-weight:600;color:var(--brand)}
.fsec{margin-top:18px}
.fsec-t{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{background:var(--surface-2);border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;color:var(--ink)}
.fchip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.fapply{margin-top:22px;width:100%;background:var(--brand);color:#fff;font-weight:600;font-size:15px;padding:15px;border-radius:14px;font-family:var(--sans)}
.fapply:active{background:var(--brand-2)}

/* ===== Part 3: pipeline ===== */
.tag-brand{background:var(--brand-soft);color:var(--brand)}
.tag-brand .d{background:var(--brand)}
.tag-teal{background:var(--teal-soft);color:#0A7980}
.tag-teal .d{background:var(--teal)}
.ic-teal{background:var(--teal-soft);color:var(--teal)}
.signal{cursor:pointer}
.pipe-head{background:var(--surface);border-bottom:1px solid var(--line-2);padding:16px 0 12px}
.ph2{display:flex;align-items:center;gap:13px;padding:0 18px}
.ph2 .n{font-family:var(--disp);font-weight:600;font-size:34px;letter-spacing:-1.2px;font-variant-numeric:tabular-nums;line-height:1}
.ph2 .t{font-size:13px;color:var(--muted);font-weight:500;line-height:1.35}
.ph2 .t b{color:var(--ink)}
.ph2 .tag{margin-left:auto}
.disc{display:flex;gap:7px;align-items:flex-start;margin:13px 18px 0;padding:10px 12px;background:var(--accent-soft);
  border:1px solid #F2DCA6;border-radius:11px;font-size:11.5px;color:#8a6200;line-height:1.4;font-weight:500}
.disc svg{width:14px;height:14px;flex:0 0 auto;margin-top:1px;color:#b4781a}
.stagerow{margin-top:14px}
.feed{padding:6px 18px 20px}
.tlgroup-h{font-size:12px;font-weight:600;color:var(--faint);margin:16px 0 6px 2px;letter-spacing:.2px}
.tl{position:relative;margin-left:2px}
.tl::before{content:"";position:absolute;left:6px;top:14px;bottom:14px;width:2px;background:var(--line)}
.tlitem{position:relative;padding-left:26px;padding-top:9px;cursor:pointer}
.tlnode{position:absolute;left:1px;top:22px;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--surface);z-index:1;box-shadow:0 0 0 1px var(--line)}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px 14px;box-shadow:var(--shadow-sm)}
.tlitem:active .scard{background:var(--surface-2)}
.sc-top{display:flex;align-items:center;gap:9px}
.sc-av{width:28px;height:28px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;font-family:var(--disp);font-weight:600;font-size:11px;color:#fff}
.sc-nm{font-weight:600;font-size:13.5px;letter-spacing:-.1px}
.sc-date{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:500;flex:0 0 auto}
.sc-head{font-weight:600;font-size:15px;letter-spacing:-.2px;margin-top:9px;line-height:1.3}
.sc-de{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.sc-foot{display:flex;align-items:center;gap:9px;margin-top:11px;flex-wrap:wrap}
.vchk.sm{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#0B7B4B;font-weight:600}
.vchk.sm svg{width:12px;height:12px}
.ev{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--faint);font-weight:500;margin-left:auto}
.ev svg{width:12px;height:12px}

/* ===== Part 3: signal detail ===== */
.sg-head{padding:18px 18px 2px}
.sg-top{display:flex;align-items:center;gap:11px}
.sg-av{width:46px;height:46px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;font-family:var(--disp);font-weight:600;font-size:15px;color:#fff}
.sg-nm{font-weight:600;font-size:16px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.sg-stage{display:flex;align-items:center;gap:9px;margin-top:14px;flex-wrap:wrap}
.vbadge{display:inline-flex;align-items:center;gap:6px;background:var(--live-soft);color:#0B7B4B;border-radius:999px;padding:6px 11px;font-size:11.5px;font-weight:600}
.vbadge svg{width:13px;height:13px}
.vbadge.amber{background:var(--accent-soft);color:#9A6200}
.sg-headline{font-family:var(--disp);font-weight:600;font-size:21px;letter-spacing:-.5px;line-height:1.2;margin-top:14px}
.sg-metapill{display:inline-flex;align-items:center;gap:7px;margin-top:12px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:11px;padding:9px 13px;font-size:12.5px;color:var(--ink);font-weight:500}
.sg-metapill svg{width:14px;height:14px;color:var(--brand);flex:0 0 auto}
.etrail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.erow{display:flex;align-items:flex-start;gap:12px;padding:14px 15px;width:100%;text-align:left}
.erow+.erow{border-top:1px solid var(--line-2)}
.erow:active{background:var(--surface-2)}
.eic{width:36px;height:36px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center}
.eic svg{width:17px;height:17px}
.emid{flex:1;min-width:0}
.el{font-weight:600;font-size:13.5px}
.ed{color:var(--faint);font-weight:500;font-size:12px}
.et{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.erow .tag{flex:0 0 auto;margin-top:2px}
.relcard{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px 14px;width:100%;text-align:left}
.relcard:active{background:var(--surface-2)}
.relcard .chev{color:var(--faint);flex:0 0 auto}
.relnone{display:flex;gap:9px;align-items:flex-start;background:var(--surface-2);border:1px dashed var(--line);border-radius:14px;padding:14px 15px;font-size:13px;color:var(--muted);line-height:1.45}
.relnone svg{width:16px;height:16px;flex:0 0 auto;margin-top:1px;color:var(--faint)}
.whocard{display:flex;gap:11px;align-items:flex-start;background:var(--brand-soft);border-radius:14px;padding:15px;font-size:13px;color:#2B2E70;line-height:1.5;font-weight:500}
.whocard svg{width:18px;height:18px;flex:0 0 auto;margin-top:1px;color:var(--brand)}

/* ===== Part 4: locations ===== */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.segbtn{flex:1;padding:10px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted)}
.segbtn.on{background:var(--surface);color:var(--brand);box-shadow:var(--shadow-sm)}
.loc-head{background:var(--surface);border-bottom:1px solid var(--line-2);padding:12px 18px 14px}
.loc-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cmpbtn{display:flex;align-items:center;gap:6px;background:var(--brand-soft);color:var(--brand);font-weight:600;font-size:13px;padding:8px 13px;border-radius:10px;flex:0 0 auto}
.cmpbtn svg{width:15px;height:15px}
.aggcard{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-sm)}
.aggcard .n{font-family:var(--disp);font-weight:600;font-size:32px;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.aggcard .t{font-size:13px;color:var(--muted);line-height:1.35}
.aggcard .t b{color:var(--ink)}
.aggcard .tag{margin-left:auto;flex:0 0 auto}
.citystat{margin:14px 18px 0}
.sectors{display:flex;flex-direction:column;gap:13px}
.sbt{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.sbt span:last-child{color:var(--muted);font-family:var(--disp);font-variant-numeric:tabular-nums}
.sbtrack{height:8px;background:var(--line-2);border-radius:999px;overflow:hidden}
.sbfill{height:100%;border-radius:999px}
.salbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.salrow{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;font-size:13.5px}
.salrow+.salrow{border-top:1px solid var(--line-2)}
.srole{font-weight:500}
.sval{font-family:var(--disp);font-weight:600;font-variant-numeric:tabular-nums}
.cchips{display:flex;gap:8px;flex-wrap:wrap}
.cchip{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:12.5px;font-weight:500;color:var(--ink)}
.cchip svg{width:13px;height:13px;color:var(--brand)}
.schemecard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:11px}
.schemecard:active{background:var(--surface-2)}
.sch-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sch-nm{font-family:var(--disp);font-weight:600;font-size:17px;letter-spacing:-.3px}
.sch-pol{font-size:12px;color:var(--muted);margin-top:3px}
.sch-head{font-size:13.5px;color:var(--ink);margin-top:9px;line-height:1.4}
.sch-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.sch-stat{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--brand)}
.sch-stat svg{width:14px;height:14px}
.inclist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.incrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 15px;font-size:13.5px}
.incrow+.incrow{border-top:1px solid var(--line-2)}
.ik{color:var(--muted);font-weight:500}
.iv{font-weight:600;text-align:right}
/* compare */
.cmp{padding:0 0 10px}
.cmp-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);display:grid;grid-template-columns:0.85fr 1fr 1fr;z-index:2}
.cmp-col-h{padding:15px 12px;text-align:left;border-left:1px solid var(--line-2)}
.cmp-city{font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:-.3px}
.cmp-sub{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:3px}
.cmp-sub svg{width:13px;height:13px}
.crow{display:grid;grid-template-columns:0.85fr 1fr 1fr;border-bottom:1px solid var(--line-2)}
.crow .cl{padding:13px 12px;font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2);display:flex;align-items:center}
.crow .cv{padding:13px 12px;font-size:13px;font-weight:600;border-left:1px solid var(--line-2);font-variant-numeric:tabular-nums}
/* pick list */
.pick-list{margin-top:14px;display:flex;flex-direction:column;gap:2px;max-height:56vh;overflow:auto}
.pickrow{display:flex;justify-content:space-between;align-items:center;padding:14px 6px;border-bottom:1px solid var(--line-2);font-size:14.5px;font-weight:600;text-align:left}
.pm{font-size:12px;color:var(--muted);font-weight:500}
/* scheme compare table */
.ctab-wrap{margin-top:12px;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md)}
.ctab{width:100%;border-collapse:collapse;font-size:12.5px;min-width:440px}
.ctab th{background:var(--surface-2);text-align:left;padding:11px 12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
.ctab td{padding:11px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.ctab td.st{font-weight:600}
.ctab tbody tr:last-child td{border-bottom:none}

/* ===== Part 5: ecosystem ===== */
.m.rate{color:var(--ink)}
.m.rate svg{color:var(--accent-bright)!important}
.verify-link{display:flex;align-items:center;gap:9px;width:100%;background:var(--brand-soft);border-radius:13px;padding:13px 15px;margin-top:14px;color:var(--brand);font-weight:600;font-size:13.5px;text-align:left}
.verify-link svg{width:17px;height:17px;flex:0 0 auto}
.verify-link span{flex:1}
.tr-badges{display:flex;flex-direction:column;gap:9px}
.tr-badge{display:flex;align-items:center;gap:9px;background:var(--live-soft);color:#0B7B4B;border-radius:11px;padding:11px 13px;font-size:13px;font-weight:600}
.tr-badge svg{width:16px;height:16px;flex:0 0 auto}
.revbox{display:flex;flex-direction:column;gap:11px}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px}
.rev-top{display:flex;align-items:center;gap:10px}
.stars{display:inline-flex;gap:1px}
.stars .st{color:var(--line);display:inline-flex}
.stars .st.on{color:var(--accent-bright)}
.stars .st svg{width:14px;height:14px}
.rev-role{font-size:12px;color:var(--muted);font-weight:600}
.rev-t{font-size:13px;color:var(--ink);margin-top:9px;line-height:1.5}
/* talent */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcell{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:15px}
.tcell .tv{font-family:var(--disp);font-weight:600;font-size:26px;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.tcell .tl{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.3}
.tcell .src{margin-top:9px}
.salcitybox{display:flex;flex-direction:column;gap:14px}
.salcity{}
.scrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.scn{font-weight:600;font-size:13.5px}
.scv{font-family:var(--disp);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.skbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}

const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function avatarText(nm){const w=nm.replace(/[^A-Za-z ]/g,'').trim().split(/\s+/);

  return ((w[0][0]||'')+(w[1][0]||'')).toUpperCase();}

function screenSearch(q){
  q = q||'';
  let body;
  if(!q.trim()){
    body = `
      <div class="pad">
        <div class="subtle">Trending now</div>
        <div class="chips">${TRENDING.map(t=>`<button class="chip" data-q="${esc(t)}">${esc(t)}</button>`).join('')}</div>
        <div style="height:24px"></div>
        <div class="subtle">Browse</div>
        <div class="chips">
          <button class="chip" data-tab="gccs">GCC registry</button>
          <button class="chip" data-tab="pipeline">Pipeline</button>
          <button class="chip" data-tab="locations">Cities & schemes</button>
          <button class="chip" data-tab="ecosystem">Providers</button>
        </div>
      </div>`;
  } else {
    const ql = q.toLowerCase();
    const mg = (arr,f)=>arr.filter(f);
    const g = mg(GCCS, x=>(x.nm+x.sec+x.city).toLowerCase().includes(ql));
    const c = mg(CITY_SEARCH, x=>(x.nm+x.de).toLowerCase().includes(ql));
    const s = mg(SCHEMES, x=>(x.nm+x.de).toLowerCase().includes(ql));
    const p = mg(PROVIDERS, x=>(x.nm+x.de).toLowerCase().includes(ql));
    const total = g.length+c.length+s.length+p.length;
    if(!total){
      body = `<div class="empty"><div class="big">No matches for "${esc(q)}"</div>
        <p>Try a company, a city like Hyderabad, a state scheme, or a provider category.</p></div>`;
    } else {
      const grp = (title,items,render)=> items.length? `
        <div class="resgroup"><div class="subtle">${title} · ${items.length}</div>
        ${items.map(render).join('')}</div>` : '';
      body = `<div class="pad">
        ${grp('GCCs',g,x=>`<button class="res" data-company="${x.id}">
          <div class="av" style="background:${x.av}">${avatarText(x.nm)}</div>
          <div><div class="nm">${esc(x.nm)}</div><div class="de">${esc(x.sec)} · ${esc(x.cities.join(' · '))}</div></div>
          <span class="chev">${I.chev}</span></button>`)}
        ${grp('Cities',c,x=>`<button class="res" data-city="${x.id}">
          <div class="av soft">${I.pin}</div>
          <div><div class="nm">${esc(x.nm)}</div><div class="de">${esc(x.de)}</div></div>
          <span class="chev">${I.chev}</span></button>`)}
        ${grp('State schemes',s,x=>`<button class="res" data-scheme="${x.id}">
          <div class="av soft">${I.doc}</div>
          <div><div class="nm">${esc(x.nm)}</div><div class="de">${esc(x.de)}</div></div>
          <span class="chev">${I.chev}</span></button>`)}
        ${grp('Providers',p,x=>`<button class="res" data-toast="Provider profiles open in Part 5 — Ecosystem">
          <div class="av soft">${I.grid}</div>
          <div><div class="nm">${esc(x.nm)}</div><div class="de">${esc(x.de)}</div></div>
          <span class="chev">${I.chev}</span></button>`)}
      </div>`;
    }
  }
  return `<div class="searchbody">${body}</div>`;
}

/* ======================= PART 2 — REGISTRY ======================= */
const SECTORS=['BFSI','Technology','Retail','Automotive / ER&D'];
const SECTOR_SHORT={'Automotive / ER&D':'ER&D'};
const PARENT_LABEL={US:'United States',UK:'United Kingdom',Europe:'Europe',APAC:'Asia–Pacific'};
const FOPTS={cities:['Bengaluru','Hyderabad','Delhi NCR','Mumbai','Pune','Chennai'],sectors:SECTORS,
  functions:['Technology','Engineering R&D','Operations','Data & AI','Supply chain','Product'],
  hc:['<500','500–2,000','2,000–5,000','5,000–20,000','20,000+'],parents:['US','UK','Europe','APAC']};
const FOCUS={'BFSI':['Technology & engineering','Operations & shared services','Risk, finance & analytics'],
  'Technology':['Product & platform engineering','Data, AI & analytics','Cloud & reliability'],
  'Retail':['Retail technology & product','Supply chain & operations','Analytics & merchandising'],
  'Automotive / ER&D':['Engineering R&D','Embedded & software','Design & simulation']};
const NAMES=['Rohan Mehta','Priya Nair','Arjun Rao','Divya Menon','Karthik Iyer','Neha Gupta','Vikram Shah','Ananya Reddy','Siddharth Jain','Meera Krishnan'];
function bucketOf(n){return n<500?'<500':n<2000?'500–2,000':n<5000?'2,000–5,000':n<20000?'5,000–20,000':'20,000+';}
function bucketShort(n){return n<500?'<500':n<2000?'0.5k–2k':n<5000?'2k–5k':n<20000?'5k–20k':'20k+';}
function rolesCount(c){return Math.min(180,Math.max(5,Math.round(c.hcNum/420)));}
function hashIdx(s,mod){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h%mod;}
function cityMatch(cs,f){if(f==='Delhi NCR')return cs.some(c=>/Gurugram|Noida|Delhi|Gurgaon|NCR/i.test(c));return cs.includes(f);}
const FILTER={cities:new Set(),sectors:new Set(),functions:new Set(),hc:new Set(),parents:new Set()};
let SORT='name';
function filterActive(){return FILTER.cities.size||FILTER.sectors.size||FILTER.functions.size||FILTER.hc.size||FILTER.parents.size;}
function matchC(c,F){
  if(F.sectors.size&&!F.sectors.has(c.sec))return false;
  if(F.parents.size&&!F.parents.has(c.region))return false;
  if(F.hc.size&&!F.hc.has(bucketOf(c.hcNum)))return false;
  if(F.cities.size&&![...F.cities].some(ci=>cityMatch(c.cities,ci)))return false;
  if(F.functions.size&&!c.functions.some(fn=>F.functions.has(fn)))return false;
  return true;
}
function countC(F){return GCCS.filter(c=>matchC(c,F)).length;}
function applyList(){let a=GCCS.filter(c=>matchC(c,FILTER));
  if(SORT==='name')a.sort((x,y)=>x.nm.localeCompare(y.nm));
  else if(SORT==='hc')a.sort((x,y)=>y.hcNum-x.hcNum);
  else if(SORT==='cities')a.sort((x,y)=>y.cities.length-x.cities.length);return a;}

function gcard(c){const roles=rolesCount(c);return `<button class="gcard" data-company="${c.id}">
  <div class="gav" style="background:${c.av}">${avatarText(c.nm)}</div>
  <div class="gmid">
    <div class="gnm">${esc(c.nm)}<span class="vchk">${I.shield}</span></div>
    <div class="gde">${esc(c.sec)} · ${esc(PARENT_LABEL[c.region])}</div>
    <div class="metarow">
      <span class="m">${I.pin}${c.cities.length} ${c.cities.length>1?'cities':'city'}</span>
      <span class="m">${I.people}${esc(bucketShort(c.hcNum))}</span>
      <span class="m hot">${I.signal}${roles} roles</span>
    </div>
  </div><span class="chev">${I.chev}</span></button>`;}

function screenDirectory(){
  const a=applyList();
  const sortLabel={name:'A–Z',hc:'Largest',cities:'Most centres'}[SORT];
  const quick=['All',...SECTORS].map(s=>{const on=s==='All'?!FILTER.sectors.size:(FILTER.sectors.size===1&&FILTER.sectors.has(s));
    return `<button class="qchip ${on?'on':''}" data-qsec="${esc(s)}">${esc(s==='All'?'All':(SECTOR_SHORT[s]||s))}</button>`;}).join('');
  const rows=a.length?a.map(gcard).join(''):`<div class="empty"><div class="big">No GCCs match</div><p>Try removing a filter.</p></div>`;
  return `<div class="dir-controls">
    <div class="qrow">${quick}</div>
    <div class="countrow"><span class="cnt"><b>${a.length}</b> shown · sample of 2,117 tracked</span>
      <button class="sortbtn" data-sort="1">${I.sortIcon}${sortLabel}</button></div>
  </div>
  <div class="pad" style="padding-top:14px">${rows}</div>`;
}

function unitsOf(c){return c.cities.map((city,i)=>({city,focus:FOCUS[c.sec][i%3],main:i===0}));}
function sampleRoles(c){
  const city=i=>c.cities[i%c.cities.length];
  const byFn={'Technology':'Senior Software Engineer','Engineering R&D':'Senior R&D Engineer','Operations':'Operations Analyst','Data & AI':'Data Scientist','Supply chain':'Supply Chain Analyst','Product':'Product Manager','Risk & Finance':'Risk Analyst','Design':'Product Designer'};
  const fns=c.functions.slice(0,2).map((f,i)=>({t:byFn[f]||'Specialist',c:city(i)}));
  fns.push({t:'Engineering Manager',c:city(1)});
  return fns.slice(0,3);
}
function leadersOf(c){
  const titlesBy={'BFSI':['India Site Leader','Head of Technology'],'Technology':['India Site Leader','Head of Engineering'],'Retail':['India Centre Head','Head of Product & Technology'],'Automotive / ER&D':['Managing Director, India','Head of Engineering']};
  const t=titlesBy[c.sec];const base=hashIdx(c.id,NAMES.length);
  return t.map((role,i)=>({role,name:NAMES[(base+i)%NAMES.length]}));
}
function cTag(conf){const m={'Verified':'tag-live','Live':'tag-live','Reported':'tag-neutral','Estimate':'tag-announce','Announced':'tag-announce'};
  return `<span class="tag ${m[conf]||'tag-neutral'}"><span class="d"></span>${conf}</span>`;}

function openFilter(){

  const sh=$('#sheet');
  sh.innerHTML=`<div class="grab"></div>
    <div class="fhead"><h3>Filter GCCs</h3><button class="freset" data-freset="1">Reset</button></div>
    ${sec('Sector','sectors')}${sec('City','cities')}${sec('Function','functions')}${sec('Headcount','hc')}${sec('Parent HQ','parents')}
    <button class="fapply" data-fapply="1">Show <span id="fcount">${countC(T)}</span> GCCs</button>`;
  const upd=()=>{const el=$('#fcount');if(el)el.textContent=countC(T);};
  sh.querySelectorAll('[data-fk]').forEach(b=>b.onclick=()=>{const k=b.dataset.fk,v=b.dataset.fv;T[k].has(v)?T[k].delete(v):T[k].add(v);b.classList.toggle('on');upd();});
  sh.querySelector('[data-freset]').onclick=()=>{Object.keys(T).forEach(k=>T[k].clear());sh.querySelectorAll('.fchip.on').forEach(x=>x.classList.remove('on'));upd();};
  sh.querySelector('[data-fapply]').onclick=()=>{FILTER.cities=T.cities;FILTER.sectors=T.sectors;FILTER.functions=T.functions;FILTER.hc=T.hc;FILTER.parents=T.parents;closeSheet();render();};
  openSheet();
}

function screenPipeline(){
  const list=pipeList();
  const chips=STAGES.map(([id,l])=>`<button class="qchip ${PIPE_STAGE===id?'on':''}" data-stage="${id}">${l}</button>`).join('');
  const buckets=[['This week',d=>d<=7],['This month',d=>d>7&&d<=30],['Earlier',d=>d>30]];
  let feed='';
  if(!list.length) feed=`<div class="empty"><div class="big">No signals at this stage</div><p>Try another stage, or view all.</p></div>`;
  else buckets.forEach(([lab,test])=>{const it=list.filter(s=>test(s.daysAgo));if(!it.length)return;
    feed+=`<div class="tlgroup-h">${lab}</div><div class="tl">${it.map(signalCard).join('')}</div>`;});

}

      <div class="srcpanel">${srcHtml}</div></div>
    <div class="sec"><div class="sechead"><h2>Why counts disagree</h2></div>
      <div class="seclead">The “numbers problem” is structural, not sloppiness — so Atlas shows ranges, not false precision.</div>
      <div class="ph-list">${whyHtml}</div></div>
    <div class="sec"><div class="sechead"><h2>How fresh is it</h2></div><div class="inclist">${freshHtml}</div></div>
    <div class="cfoot">Atlas aggregates data that already exists but is scattered — then verifies, dates and sources every field.</div>
  </div>`;
}

/* ======================= APP BARS ======================= */
function barHome(){
  return `<div class="appbar flush">
    <div class="brand"><div class="glyph">${I.shieldFill.replace(/currentColor/g,'#fff')}</div>
      <div class="wm">Atlas</div></div>
    <div class="right"><span class="pill-india"><span class="dot"></span>India</span></div>
  </div>`;
}
function barSearch(q){
  return `<div class="searchhead">
    <button class="back" data-back="1" style="width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2)">${I.back}</button>
    <div class="inp">${I.search}<input id="searchInput" placeholder="Search GCCs, cities, schemes…" value="${esc(q||'')}" autocomplete="off"/>
      ${q?`<button class="clr" data-clear="1">${I.close}</button>`:''}</div>
  </div>`;
}
function barTitle(t){
  return `<div class="appbar"><div class="title">${esc(t)}</div></div>`;
}
function barDirectory(){
  const active=filterActive();
  return `<div class="appbar">
    <div class="title">GCC registry</div>
    <div class="right">
      <button class="iconbtn" data-go="search">${I.search}</button>
      <button class="iconbtn ${active?'on':''}" data-openfilter="1">${I.filter}${active?'<span class="fdot"></span>':''}</button>
    </div>
  </div>`;
}
function barCompany(c){
  return `<div class="appbar">
    <button class="back" data-back="1">${I.back}</button>
    <div class="title" style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16.5px">${esc(c.nm)}</div>
  </div>`;
}
function barSignal(s){
  return `<div class="appbar">
    <button class="back" data-back="1">${I.back}</button>
    <div class="title" style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16.5px">${esc(s.nm)}</div>
  </div>`;
}
function barCity(c){
  return `<div class="appbar"><button class="back" data-back="1">${I.back}</button>
    <div class="title" style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16.5px">${esc(c.nm)}</div></div>`;
}
function barScheme(s){
  return `<div class="appbar"><button class="back" data-back="1">${I.back}</button>
    <div class="title" style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16.5px">${esc(s.state)}</div></div>`;
}
function barProvider(p){
  return `<div class="appbar"><button class="back" data-back="1">${I.back}</button>
    <div class="title" style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16.5px">${esc(p.nm)}</div></div>`;
}

/* ======================= BOTTOM NAV ======================= */
const TABS=[
  {id:'explore',icon:'explore',lab:'Explore'},
  {id:'gccs',icon:'building',lab:'GCCs'},
  {id:'pipeline',icon:'signal',lab:'Pipeline'},
  {id:'locations',icon:'pin',lab:'Locations'},
  {id:'ecosystem',icon:'grid',lab:'Ecosystem'},
];
function renderNav(){
  $('#nav').outerHTML = `<div class="bottomnav" id="nav">${TABS.map(t=>`
    <button class="navitem ${State.tab===t.id&&!State.stack.length?'active':''}" data-navtab="${t.id}">
      <span class="ic">${I[t.icon]}</span><span class="lab">${t.lab}</span>
    </button>`).join('')}</div>`;
}

/* ======================= ROUTER ======================= */
const State={tab:'explore',stack:[]}; // stack: [{screen:'search',q:''}]
function rootOf(tab){
  if(tab==='explore') return {bar:barHome(),body:screenHome()};
  if(tab==='gccs') return {bar:barDirectory(),body:screenDirectory()};
  if(tab==='pipeline') return {bar:barTitle("Who's coming next"),body:screenPipeline()};
  if(tab==='locations') return {bar:barTitle('Locations'),body:screenLocations()};
  if(tab==='ecosystem') return {bar:barTitle('Ecosystem'),body:screenEcosystem()};
  return {bar:barTitle(TABS.find(t=>t.id===tab).lab), body:screenPlaceholder(tab)};
}
function render(){
  let bar,body;
  if(State.stack.length){
    const top=State.stack[State.stack.length-1];
    if(top.screen==='search'){bar=barSearch(top.q);body=screenSearch(top.q);}
    else if(top.screen==='company'){bar=barCompany(GCCS.find(x=>x.id===top.id));body=screenCompany(top.id);}
    else if(top.screen==='signal'){bar=barSignal(SIGNALS.find(x=>x.id===top.id));body=screenSignal(top.id);}
    else if(top.screen==='city'){bar=barCity(CITYDATA.find(x=>x.id===top.id));body=screenCity(top.id);}
    else if(top.screen==='scheme'){bar=barScheme(SCHEMES2.find(x=>x.id===top.id));body=screenScheme(top.id);}
    else if(top.screen==='compare'){bar=barTitle('Compare cities');body=screenCompare();}
    else if(top.screen==='schemecompare'){bar=barTitle('Compare incentives');body=screenSchemeCompare();}
    else if(top.screen==='provider'){bar=barProvider(PROVIDERS2.find(x=>x.id===top.id));body=screenProvider(top.id);}
    else if(top.screen==='trust'){bar=barTitle('How we know this');body=screenTrust();}
  } else {
    const r=rootOf(State.tab); bar=r.bar; body=r.body;
  }
  $('#appbar').outerHTML=`<div id="appbar">${bar}</div>`;
  const sc=$('#screen'); sc.innerHTML=body; sc.scrollTop=0;
  renderNav();
  if(State.stack.length && State.stack[State.stack.length-1].screen==='search'){
    const inp=$('#searchInput'); if(inp){inp.focus(); 
      inp.oninput=e=>{const q=e.target.value; State.stack[State.stack.length-1].q=q;
        const sc2=$('#screen'); sc2.innerHTML=screenSearch(q);
        // keep the X in sync without re-rendering the bar/focus
        bindScreen();
      };}
  }
  bindScreen();
}
function switchTab(tab){State.tab=tab;State.stack=[];render();}
function go(screen,params){State.stack.push(Object.assign({screen},params||{}));render();}
function back(){State.stack.pop();render();}

/* ======================= SHEETS / TOAST ======================= */
function openSrc(id){
  const s=SRC[id];
  const url = s.url? `<a class="link" href="https://${s.url}" target="_blank" rel="noopener">${I.ext} Open ${esc(s.url)}</a>`:'';
  $('#sheet').innerHTML=`
    <div class="grab"></div>
    <h3><span class="vb">${I.shield}</span>Source</h3>
    <div class="srcmeta">
      <div class="m"><span class="k">Publisher</span><span class="v">${esc(s.full)}</span></div>
      <div class="m"><span class="k">As of</span><span class="v">${esc(s.asof)}</span></div>
      <div class="m"><span class="k">Confidence</span><span class="v ${['Verified','Verified count','Reported','Live'].includes(s.conf)?'ok':''}">${esc(s.conf)}</span></div>
    </div>
    <div class="note">${esc(s.note)}</div>
    ${url}
    <div class="foot-note">Atlas shows provenance on every figure so you can judge it yourself — and flags when numbers are estimated rather than measured.</div>
    <button class="link" style="background:var(--surface-2);color:var(--brand);margin-top:10px" id="srcTrust">${I.shield} How Atlas sources data</button>`;
  const tb=$('#srcTrust'); if(tb) tb.onclick=()=>{closeSheet();go('trust');};
  openSheet();
}
function openSheet(){$('#scrim').classList.add('on');$('#sheet').classList.add('on');}
function closeSheet(){$('#scrim').classList.remove('on');$('#sheet').classList.remove('on');}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200);}

/* ======================= EVENT BINDING ======================= */
function bindScreen(){
  document.querySelectorAll('[data-src]').forEach(b=>b.onclick=e=>{e.stopPropagation();openSrc(b.dataset.src);});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
  document.querySelectorAll('[data-go="search"]').forEach(b=>b.onclick=()=>go('search',{q:''}));
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{
    const top=State.stack[State.stack.length-1];
    if(top&&top.screen==='search'){top.q=b.dataset.q;render();}
  });
  document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{
    const top=State.stack[State.stack.length-1]; if(top){top.q='';render();}});
  document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>back());
  document.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>toast(b.dataset.toast));
  document.querySelectorAll('[data-navtab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.navtab));
  document.querySelectorAll('[data-company]').forEach(b=>b.onclick=()=>go('company',{id:b.dataset.company}));
  document.querySelectorAll('[data-openfilter]').forEach(b=>b.onclick=()=>openFilter());
  document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{SORT=SORT==='name'?'hc':SORT==='hc'?'cities':'name';render();});
  document.querySelectorAll('[data-qsec]').forEach(b=>b.onclick=()=>{const s=b.dataset.qsec;
    if(s==='All')FILTER.sectors.clear();else FILTER.sectors=new Set([s]);render();});
  document.querySelectorAll('[data-signal]').forEach(b=>b.onclick=()=>go('signal',{id:b.dataset.signal}));
  document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{PIPE_STAGE=b.dataset.stage;render();});
  document.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>go('city',{id:b.dataset.city}));
  document.querySelectorAll('[data-scheme]').forEach(b=>b.onclick=()=>go('scheme',{id:b.dataset.scheme}));
  document.querySelectorAll('[data-loc]').forEach(b=>b.onclick=()=>{LOC_VIEW=b.dataset.loc;render();});
  document.querySelectorAll('[data-tier]').forEach(b=>b.onclick=()=>{CITY_TIER=b.dataset.tier;render();});
  document.querySelectorAll('[data-compare]').forEach(b=>b.onclick=()=>go('compare'));
  document.querySelectorAll('[data-schemecompare]').forEach(b=>b.onclick=()=>go('schemecompare'));
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>openCityPicker(b.dataset.pick));
  document.querySelectorAll('[data-provider]').forEach(b=>b.onclick=()=>go('provider',{id:b.dataset.provider}));
  document.querySelectorAll('[data-eco]').forEach(b=>b.onclick=()=>{ECO_VIEW=b.dataset.eco;render();});
  document.querySelectorAll('[data-pcat]').forEach(b=>b.onclick=()=>{PCAT=b.dataset.pcat;render();});
  document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{TALENT_ROLE=b.dataset.role;render();});
  document.querySelectorAll('[data-trust]').forEach(b=>b.onclick=()=>go('trust'));
}
$('#scrim').onclick=closeSheet;

/* clock */
function tick(){const d=new Date();let h=d.getHours(),m=d.getMinutes();
  $('#clock').textContent=`${h}:${String(m).padStart(2,'0')}`;}
tick();setInterval(tick,10000);

/* boot */
render();
</script>
</body>
</html>
